<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pricing</title>
<style>
  :root {
    --bg: #f4f4f1;
    --text: #1b1b1b;
    --muted: #5a5a5a;
    --modal-border: #b3202e;
    --modal-fill: #ecb8ec;
    --c30: #1f5fa8;
    --c35: #3a6b1f;
    --c40: #4b2a8a;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --text: #f2f2f2;
      --muted: #b0b0b6;
      --modal-border: #ff6b78;
      --modal-fill: #4a2a4a;
      --c30: #7fb4ee;
      --c35: #8fd16a;
      --c40: #b79af0;
      --card: #1c1c20;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 34px; font-weight: 600; margin: 8px 0 20px; }

  .modal {
    border: 4px solid var(--modal-border);
    background: var(--card);
    margin-bottom: 28px;
  }
  .modal label {
    display: block; text-align: center; font-size: 28px; font-weight: 700; padding: 12px 8px 8px;
  }
  .modal .field { background: var(--modal-fill); padding: 12px 8px; }
  .modal input {
    width: 100%; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 44px; font-weight: 800; text-align: center;
    min-height: 56px; outline: none; -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .modal input::placeholder { color: var(--muted); opacity: .6; }
  .modal:focus-within { box-shadow: 0 0 0 3px var(--modal-border); }

  .row {
    --c: var(--c30);
    display: grid; grid-template-columns: 1fr 1.4fr; align-items: center;
    border: 3px solid var(--c); background: var(--card); color: var(--c);
    margin-bottom: 14px; padding: 12px 8px; text-align: center;
  }
  .row.m35 { --c: var(--c35); }
  .row.m40 { --c: var(--c40); }
  .row .pct { font-size: 30px; font-weight: 800; }
  .row .label { font-size: 26px; font-weight: 800; letter-spacing: .01em; }
  .row .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .note { color: var(--muted); font-size: 14px; line-height: 1.45; text-align: center; margin-top: 18px; }
  @media (max-width: 340px) {
    .row .pct { font-size: 24px; } .row .label { font-size: 20px; } .row .val { font-size: 20px; }
    .modal input { font-size: 34px; }
  }
</style>
</head>
<body>
<main>
  <h1>Pricing</h1>

  <section class="modal">
    <label for="modal">Modal</label>
    <div class="field">
      <input id="modal" type="text" inputmode="numeric" autocomplete="off" placeholder="0" maxlength="15" aria-describedby="catatan">
    </div>
  </section>

  <!-- Baris hanya dibaca (tidak bisa diedit); hanya kolom Modal yang bisa diisi. -->
  <section class="row m30" aria-label="Margin 30 persen">
    <div><div class="pct">30%</div><div class="val" data-profit="30">-</div></div>
    <div><div class="label">HARGA JUAL</div><div class="val" data-jual="30">-</div></div>
  </section>
  <section class="row m35" aria-label="Margin 35 persen">
    <div><div class="pct">35%</div><div class="val" data-profit="35">-</div></div>
    <div><div class="label">HARGA JUAL</div><div class="val" data-jual="35">-</div></div>
  </section>
  <section class="row m40" aria-label="Margin 40 persen">
    <div><div class="pct">40%</div><div class="val" data-profit="40">-</div></div>
    <div><div class="label">HARGA JUAL</div><div class="val" data-jual="40">-</div></div>
  </section>

  <p class="note" id="catatan">
    Kiri: modal + margin profit. Harga jual: harga yang setelah diskon 10% kira-kira sama dengan angka di kiri,
    dibulatkan ke atas ke kelipatan Rp5.000.
  </p>
</main>

<script>
(function () {
  var DISKON = 10;      // persen
  var BULAT = 5000;     // rupiah
  var input = document.getElementById("modal");

  function fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  // Aritmetika bilangan bulat supaya tidak ada galat pecahan.
  // profit      = modal * (100 + m) / 100
  // harga jual  = profit / (1 - diskon/100) = modal * (100 + m) / (100 - diskon), dibulatkan ke atas ke kelipatan BULAT
  function hitung(modal, m) {
    var profit = Math.round(modal * (100 + m) / 100);
    var kasar = Math.ceil(modal * (100 + m) / (100 - DISKON));
    var jual = Math.ceil(kasar / BULAT) * BULAT;
    return { profit: profit, jual: jual };
  }

  function render() {
    var digits = input.value.replace(/\D/g, "").replace(/^0+/, "");
    var modal = digits ? parseInt(digits, 10) : 0;
    input.value = digits ? fmt(digits) : "";
    [30, 35, 40].forEach(function (m) {
      var p = document.querySelector('[data-profit="' + m + '"]');
      var j = document.querySelector('[data-jual="' + m + '"]');
      if (modal > 0) {
        var r = hitung(modal, m);
        p.textContent = fmt(r.profit);
        j.textContent = fmt(r.jual);
      } else {
        p.textContent = "-";
        j.textContent = "-";
      }
    });
  }

  input.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
